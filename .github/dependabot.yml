# Please see the documentation for all configuration options:
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      all:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Builder stages and the app base image. Alpine and the Home Assistant base
  # are both tagged by Alpine release; keep them on the same minor.
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/addon"
    schedule:
      interval: "weekly"
    groups:
      docker:
        patterns:
          - "*"
