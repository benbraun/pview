name: addon

on:
  pull_request:
    branches:
      - main
    paths:
      - "addon/**"
      - ".github/workflows/addon.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test build ${{ matrix.arch }} app image
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Keep in sync with the arch list in addon/config.yaml.
      matrix:
        include:
          - arch: amd64
            os: ubuntu-24.04
          - arch: aarch64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build ${{ matrix.arch }} app image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          context: .
          file: addon/Dockerfile
          image: ghcr.io/${{ github.repository_owner }}/pview-addon-${{ matrix.arch }}
          image-tags: pr-${{ github.event.number }}
          version: pr-${{ github.event.number }}
          push: false
          cosign: false
