services:
  pv2mqtt:
    build:
      context: .
      dockerfile: Dockerfile.notls
    container_name: pv2mqtt
    restart: unless-stopped
    env_file:
      - .env
    # Host networking is required for mDNS hub discovery
    network_mode: host
    environment:
      PV_STATE_FILE: /data/pview-state.json
    volumes:
      - pview-state:/data

volumes:
  pview-state:
